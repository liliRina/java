<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кнопки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        img {
            width: 240px;
            height: 240px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee;
        }
        .hydration {
            margin: 20px 0 4px;
            font-size: 0.95rem;
            color: #555;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: #4caf50;
            border-radius: 99px;
            transition: width 0.8s ease, background 0.8s ease;
            width: 0%;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover { background: #43a047; }

        .weather {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 1px solid #ebebeb;
        }
        .weather-title {
            font-size: 0.95rem;
            color: #888;
            font-weight: 600;
        }
        .weather-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .weather-item .big {
            font-size: 2.4rem;
            font-weight: 700;
            color: #222;
            line-height: 1;
        }
        .weather-item .sub {
            font-size: 0.8rem;
            color: #999;
        }
        .weather-divider {
            width: 1px;
            height: 40px;
            background: #e0e0e0;
        }
    </style>

    <script>
        function setHydration(v) {
            document.querySelector('.hydration-val').textContent = v;
            const fill = document.querySelector('.progress-fill');
            fill.style.width = v + '%';
            fill.style.background = v < 30 ? '#e53935' : v < 50 ? '#fb8c00' : '#4caf50';
        }
        setInterval(() => {
            fetch('/get_time')
                .then(r => r.json())
                .then(d => {
                    document.getElementById('timid_img').src = d.imagePath;
                    setHydration(d.hydrationLevel);
                    document.getElementById('weatherTemp').textContent = d.weather.temperature;
                    document.getElementById('weatherHum').textContent = d.weather.humidity;
                });
        }, 5000);
        window.addEventListener('DOMContentLoaded', () => {
            const v = parseInt(document.querySelector('.hydration-val').textContent) || 0;
            const fill = document.querySelector('.progress-fill');
            // Сначала ставим без анимации
            fill.style.transition = 'none';
            fill.style.width = v + '%';
            fill.style.background = v < 30 ? '#e53935' : v < 60 ? '#fb8c00' : '#4caf50';
            // Потом включаем анимацию для будущих изменений
            requestAnimationFrame(() => {
                fill.style.transition = 'width 0.8s ease, background 0.8s ease';
            });
        });
    </script>
</head>
<body>
<div class="container">
    <img id="timid_img" th:src="@{${imagePath}}" src="https://placehold.co/240x240/eee/aaa?text=🌱" alt="Растение">

    <p class="hydration">Влажность: <span class="hydration-val hydration-display" th:text="${hydrationLevel}">0</span>%</p>
    <div class="progress-bar"><div class="progress-fill"></div></div>

    <form action="/water" method="post">
        <button type="submit">💧 Полить</button>
    </form>

    <div class="weather">
        <span class="weather-title">🌤 Погода</span>
        <div class="weather-item">
            <span class="big">
            <span id="weatherTemp" th:text="${weather != null ? weather.temperature : '--'}">--</span>°
            </span>
            <span class="sub">температура</span>
        </div>
        <div class="weather-divider"></div>
        <div class="weather-item">
            <span class="big">
            <span id="weatherHum" th:text="${weather != null ? weather.humidity : '--'}">--</span>%
            </span>
            <span class="sub">влажность</span>
        </div>
    </div>
</div>
</body>
</html>
