spring:
  application:
    name: CarLeasing_Rabbit
  datasource:
    url: jdbc:postgresql://localhost:5432/car_leasing
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    publisher-confirm-type: correlated   # Включает ConfirmCallback
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 5000
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
        default-requeue-rejected: false

  jpa:
    show-sql: true                                       # Показывать SQL в логах
    hibernate:
      ddl-auto: update                                   # Стратегия DDL
  properties:
    hibernate:
      format_sql: true                                 # Форматировать SQL
      dialect: org.hibernate.dialect.PostgreSQLDialect # Диалект PostgreSQL
      jdbc:
        batch_size: 20                                # Размер пакетной обработки
      order_inserts: true                              # Оптимизация INSERT
      order_updates: true                              # Оптимизация UPDATE
      generate_statistics: true                       # Сбор статистики


